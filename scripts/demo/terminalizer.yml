command: powershell.exe
cwd: D:/Daedalus
env:
  FORCE_COLOR: "3"
  TERM: xterm-256color
cols: 110
rows: 36
repeat: 0
quality: 100
frameDelay: auto
maxIdleTime: 3000

frameBox:
  type: window
  title: "Daedalus — AI Coding CLI"
  style:
    background: "#0f0f1a"

cursorStyle: block
fontFamily: "Cascadia Code, Fira Code, Consolas, monospace"
fontSize: 14
lineHeight: 1.2
letterSpacing: 0

theme:
  background:    "#0f0f1a"
  foreground:    "#e2e8f0"
  cursor:        "#00d4aa"
  cursorAccent:  "#0f0f1a"
  selection:     "rgba(0, 212, 170, 0.15)"
  black:         "#1a1a2e"
  red:           "#ff6b6b"
  green:         "#00d4aa"
  yellow:        "#ffd93d"
  blue:          "#7c3aed"
  magenta:       "#a78bfa"
  cyan:          "#00d4aa"
  white:         "#e2e8f0"
  brightBlack:   "#2a2a4a"
  brightRed:     "#ff8787"
  brightGreen:   "#20e5bb"
  brightYellow:  "#ffe066"
  brightBlue:    "#9d5cf5"
  brightMagenta: "#c4b5fd"
  brightCyan:    "#20e5bb"
  brightWhite:   "#f8fafc"
