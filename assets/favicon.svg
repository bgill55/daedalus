<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55ffff" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame -->
  <polygon points="32,2 58,16 58,48 32,62 6,48 6,16" 
           fill="url(#bgGrad)" 
           stroke="url(#glowGrad)" 
           stroke-width="2.2" 
           stroke-linejoin="round" />

  <!-- Geometric Labyrinth Rings (Daedalus Motif) -->
  <polygon points="32,8 52,19.5 52,44.5 32,56 12,44.5 12,19.5" 
           fill="none" 
           stroke="#1e293b" 
           stroke-width="1.2" 
           stroke-dasharray="8, 3" />

  <!-- Labyrinth Corner Accent Tracks -->
  <path d="M 18,23 L 26,18.5 M 46,23 L 38,18.5 M 18,41 L 26,45.5 M 46,41 L 38,45.5" 
        stroke="#00f0ff" 
        stroke-opacity="0.35" 
        stroke-width="1.2" 
        stroke-linecap="round" />

  <!-- Central Glowing Lightning Bolt -->
  <polygon points="34,13 22,31 31,31 29,49 43,28 34,28" 
           fill="url(#boltGrad)" 
           filter="url(#glow)" />
</svg>
