<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daedalus — AI Coding Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'><path d='M12 16L24 32L12 48' stroke='%2300d4aa' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/><path d='M32 16V48' stroke='%237c3aed' stroke-width='4.5' stroke-linecap='round'/><path d='M32 16H44C51 16 54 22 54 32C54 42 51 48 44 48H32' stroke='%2300d4aa' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/><path d='M39 24H42C44 24 46 26 46 32C46 38 44 40 42 40H39' stroke='%237c3aed' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M39 29V35' stroke='%2300d4aa' stroke-width='3' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.min.css">
  <style>
    :root {
      --daedalus-cyan: #00d4aa;
      --daedalus-purple: #7c3aed;
      --daedalus-bg: #0f0f1a;
      --daedalus-surface: #1a1a2e;
      --daedalus-border: #2a2a4a;
      --daedalus-text: #e2e8f0;
      --daedalus-muted: #94a3b8;
      --cover-max-width: 60em;
    }
    /* Base */
    body, .docsify-dark {
      background: var(--daedalus-bg) !important;
      color: var(--daedalus-text);
    }
    .app-nav, .sidebar, .content {
      background: var(--daedalus-bg);
    }
    /* Sidebar */
    .sidebar {
      border-right: 1px solid var(--daedalus-border);
      background: var(--daedalus-surface);
    }
    .sidebar ul li a {
      color: var(--daedalus-muted);
      border-left: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .sidebar ul li a:hover {
      color: var(--daedalus-cyan);
      border-left-color: var(--daedalus-cyan);
    }
    .sidebar ul li.active > a {
      color: var(--daedalus-cyan);
      border-left-color: var(--daedalus-cyan);
    }
    .sidebar .app-name-link {
      color: var(--daedalus-cyan) !important;
      font-weight: bold;
      font-size: 1.3em;
    }
    /* Links */
    a { color: var(--daedalus-cyan); }
    a:hover { color: #00ffcc; }
    /* Code blocks */
    .markdown-section pre {
      background: var(--daedalus-surface) !important;
      border: 1px solid var(--daedalus-border);
      border-radius: 8px;
    }
    .markdown-section code {
      background: var(--daedalus-surface);
      color: var(--daedalus-cyan);
      padding: 2px 6px;
      border-radius: 4px;
    }
    /* Headers */
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: var(--daedalus-text);
      border-bottom: 1px solid var(--daedalus-border);
      padding-bottom: 0.3em;
    }
    .markdown-section h1 { color: var(--daedalus-cyan); }
    .markdown-section h2 { color: #a78bfa; }
    /* Tables */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
    }
    .markdown-section th {
      background: var(--daedalus-surface);
      color: var(--daedalus-cyan);
      border: 1px solid var(--daedalus-border);
      padding: 10px 14px;
    }
    .markdown-section td {
      border: 1px solid var(--daedalus-border);
      padding: 8px 14px;
    }
    .markdown-section tr:nth-child(even) {
      background: rgba(0, 212, 170, 0.03);
    }
    /* Blockquotes */
    .markdown-section blockquote {
      border-left: 4px solid var(--daedalus-cyan);
      background: rgba(0, 212, 170, 0.05);
      padding: 12px 20px;
      border-radius: 0 8px 8px 0;
    }
    /* Cover page */
    .cover {
      background: linear-gradient(135deg, var(--daedalus-bg) 0%, var(--daedalus-surface) 50%, #0a0a1a 100%) !important;
    }
    .cover-main {
      text-align: center;
      padding: 4em 2em;
    }
    .cover-main .logo {
      font-size: 4em;
      margin-bottom: 0.3em;
    }
    .cover-main .logo svg {
      filter: drop-shadow(0 0 20px rgba(0, 212, 170, 0.4));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .cover-main h1 {
      color: var(--daedalus-cyan) !important;
      font-size: 3.2em;
      font-weight: 800;
      margin: 0.2em 0;
      letter-spacing: -0.02em;
    }
    .cover-main h1 small {
      display: block !important;
      position: relative !important;
      left: auto !important;
      color: var(--daedalus-muted);
      font-size: 0.45em;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-top: 0.3em;
      text-align: center !important;
    }
    .cover-main p {
      color: var(--daedalus-text) !important;
      font-size: 1.15em;
      max-width: 32em;
      margin: 1.5em auto;
      line-height: 1.7;
    }
    .cover-main .hero-text {
      max-width: 32em;
      margin: 1.5em auto;
    }
    .cover-main .hero-text p {
      margin: 0;
      line-height: 1.7;
    }
    /* Mermaid diagrams */
    .mermaid {
      background: var(--daedalus-surface);
      border: 1px solid var(--daedalus-border);
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    /* Navigation */
    .app-nav {
      background: var(--daedalus-surface);
      border-bottom: 1px solid var(--daedalus-border);
    }
    .app-nav > ul > li > a {
      color: var(--daedalus-muted);
    }
    .app-nav > ul > li > a:hover {
      color: var(--daedalus-cyan);
    }
    /* Search */
    #tsd-search {
      background: var(--daedalus-surface);
      border: 1px solid var(--daedalus-border);
    }
    #tsd-search-input {
      background: var(--daedalus-bg);
      color: var(--daedalus-text);
      border: 1px solid var(--daedalus-border);
    }
    /* Mobile */
    @media (max-width: 768px) {
      .sidebar {
        background: var(--daedalus-surface);
      }
      .sidebar-toggle {
        background: var(--daedalus-surface);
        border: 1px solid var(--daedalus-border);
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  
  <script>
    window.$docsify = {
      name: 'Daedalus',
      repo: 'https://github.com/bgill55/daedalus',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      mergeNavbar: true,
      subMaxLevel: 3,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results found!'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossDomain: true
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>
  
  <!-- Core Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  
  <!-- Mermaid Support -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
  </script>
  
  <!-- Custom Navigation -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Add API Reference link to navigation
      const nav = document.querySelector('.app-nav');
      if (nav) {
        const apiLink = document.createElement('li');
        apiLink.innerHTML = '<a href="modules.html">API Reference</a>';
        nav.querySelector('ul').appendChild(apiLink);
        
        // Also add hierarchy link
        const hierarchyLink = document.createElement('li');
        hierarchyLink.innerHTML = '<a href="hierarchy.html">Class Hierarchy</a>';
        nav.querySelector('ul').appendChild(hierarchyLink);
      }
      
      // Add API Reference to sidebar
      const sidebar = document.querySelector('.sidebar');
      if (sidebar) {
        const apiItem = document.createElement('li');
        apiItem.innerHTML = '<a href="modules.html">API Reference</a>';
        sidebar.querySelector('ul').appendChild(apiItem);
        
        // Also add hierarchy item
        const hierarchyItem = document.createElement('li');
        hierarchyItem.innerHTML = '<a href="hierarchy.html">Class Hierarchy</a>';
        sidebar.querySelector('ul').appendChild(hierarchyItem);
      }
    });
  </script>
</body>
</html>
