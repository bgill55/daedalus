name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  pr-title:
    name: PR Title (conventional-commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate PR title follows conventional commits
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|docs|refactor|test|build|ci|chore|style|revert)(\([a-zA-Z0-9._-]+\))?(!)?: .+'
          safe_title=$(printf '%s' "$PR_TITLE" | tr -d '\r\n')
          if printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "PR title is valid: $safe_title"
          else
            echo "::error::PR title does not follow Conventional Commits."
            echo "Title: $safe_title"
            echo "Expected format: <type>(<optional scope>): <subject>"
            echo "Types: feat|fix|perf|docs|refactor|test|build|ci|chore|style|revert"
            echo "Example: feat(router): add catalog-aware model health checks"
            exit 1
          fi
      - name: No PR title to validate on push/dispatch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: echo "Push or dispatch event — skipping PR title validation."

  lint:
    name: Lint
    needs: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=20.0.0'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test (${{ matrix.os }})
    needs: pr-title
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=20.0.0'
          cache: npm
      - run: npm ci
      - run: npx vitest run --reporter=verbose
