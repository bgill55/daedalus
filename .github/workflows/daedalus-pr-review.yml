name: Daedalus PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  daedalus-review:
    name: Daedalus Automated Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Daedalus Headless PR Review
        id: daedalus
        env:
          NO_COLOR: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAEDALUS_ROUTER_KEY: ${{ secrets.DAEDALUS_ROUTER_KEY }}
        run: |
          npx tsx src/index.ts --ci ${{ github.event.pull_request.number }} > pr_review_report.md || true
          cat pr_review_report.md

      - name: Post PR Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              if (fs.existsSync('pr_review_report.md')) {
                report = fs.readFileSync('pr_review_report.md', 'utf8').trim();
              }
            } catch (err) {
              console.log('Failed to read review report:', err.message);
            }
            
            if (!report) {
              console.log('Skipping GitHub comment: review report was empty.');
              return;
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
